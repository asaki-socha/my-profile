
 
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポートフォリオ</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- ヘッダー -->
  <header class="bg-green-200 text-white py-8 text-center rounded-lg">
    <h1 class="text-3xl font-bold text-indigo-500">明咲的作品集📚</h1>
    <p class="mt-2 text-gray-500">POSSEでプログラミングを学んでいます</p>
  </header>

  
  <main class="max-w-3xl mx-auto px-4 py-12 space-y-16">

    <!-- 自己紹介 -->
    <section>
      <h2 class="text-2xl font-bold mb-4 text-blue-400">自己紹介</h2>
      <p class="text-gray-600 leading-relaxed">
        7.0期生
        POSSEでWeb制作を学んでいます。
      </p>
    </section>

    <!-- スキルリスト -->
    <section>
      <h2 class="text-2xl font-bold mb-4 text-blue-400">技能</h2>
      <ul class="flex flex-wrap gap-2">
        <li class="transition-all duration-200 hover:scale-110
                   bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
          HTML
        </li>
        <li class="transition-all duration-200 hover:scale-110
                   bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
          Tailwind CSS
        </li>
        <li class="transition-all duration-200 hover:scale-110
                   bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
          JavaScript
        </li>
      </ul>
    </section>

    <!-- 作品スライダー -->
    <section>
      <h2 class="text-2xl font-bold mb-4 text-blue-400">作品</h2>
      <section class="splide" aria-label="作品スライダー">
        <div class="splide__track">
          <ul class="splide__list">
            <li class="splide__slide">
              <img src="image copy.png" alt="作品1"
              class="w-full rounded-lg object-cover">
            </li>

                  
            <li class="splide__slide">
              <img src="image.png" alt="作品2"
                   class="w-full rounded-lg object-cover">
            </li>
          </ul>
        </div>
      </section>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
     <!-- 初期化コード（必須） -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      new Splide('.splide', {
        type: 'loop',
        perPage: 1,
        autoplay: true,
      }).mount();
    });
  </script>
  </main>

  <!-- フッター -->
  <footer class="bg-gray-800 text-gray-400 text-center py-6 mt-16">
    <p>2026 POSSE　7.0期生　明咲</p>
  </footer>

</body>
</html>
